<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>『StarSavior』Gear Substats Checker</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script type="importmap">
      {
        "imports": {
          "@material/web/": "https://esm.run/@material/web/"
        }
      }
    </script>
    <script type="module">
      import "@material/web/all.js";
    </script>

    <style>
      :root {
        /* Neutral Dark Theme */
        --md-sys-color-background: #1b1d21;
        --md-sys-color-on-background: #edf2f7;

        --md-sys-color-surface: #25282d;
        --md-sys-color-on-surface: #f8fafc;

        --md-sys-color-surface-variant: #31363d;
        --md-sys-color-on-surface-variant: #d8dee9;

        --md-sys-color-outline-variant: #49515b;

        /* Blue Accent */
        --md-sys-color-primary: #7dd3fc;
        --md-sys-color-on-primary: #082f49;
        --md-sys-color-primary-container: #1e3a5f;
        --md-sys-color-on-primary-container: #dbeafe;

        --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      md-outlined-text-field {
        width: 100%;

        --md-outlined-text-field-focus-outline-color: #7dd3fc;
        --md-outlined-text-field-focus-label-text-color: #7dd3fc;
        --md-outlined-text-field-caret-color: #7dd3fc;
      }
      md-filled-button {
        --md-filled-button-container-color: #3b4d66;
        --md-filled-button-label-text-color: #ffffff;
      }

      md-text-button {
        --md-text-button-label-text-color: #7dd3fc;
      }

      body {
        font-family: "Roboto", sans-serif;
        background: linear-gradient(180deg, #1b1b1f 0%, #202126 100%);
        color: var(--md-sys-color-on-background);
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        margin: 0;
        min-height: 100vh;
      }

      .container {
        background: var(--md-sys-color-surface);
        padding: 32px;
        border-radius: 24px;
        box-shadow: var(--card-shadow);
        border: 1px solid rgba(255, 255, 255, 0.06);
        max-width: 600px;
        width: 100%;
      }

      h2 {
        margin-top: 0;
        margin-bottom: 24px;
        font-weight: 600;
        text-align: center;
        color: #fafafa;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      @media (max-width: 500px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      md-outlined-text-field {
        width: 100%;
      }

      .buttons {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 16px;
        margin-bottom: 24px;
      }

      #result-card {
        padding: 20px;
        background: var(--md-sys-color-surface-variant);
        color: var(--md-sys-color-on-surface-variant);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: none;
      }

      #result-card.visible {
        display: block;
      }

      /* Styles for the new placeholders */
      .placeholder-text {
        text-align: center;
        font-style: italic;
        opacity: 0.8;
      }

      .stat-line {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        margin: 16px 0;
      }

      .summary-line {
        display: flex;
        justify-content: space-between;
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 1.1em;
        color: #ffffff;
      }

      md-outlined-text-field {
        width: 100%;
        --md-outlined-text-field-container-shape: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>『StarSavior』Gear Substats Checker</h2>

      <form id="statForm">
        <div class="grid">
          <md-outlined-text-field
            id="speed"
            label="Speed"
            type="number"
            step="any"
          ></md-outlined-text-field>
          <md-outlined-text-field
            id="flat-attack"
            label="Flat Attack"
            type="number"
            step="any"
          ></md-outlined-text-field>
          <md-outlined-text-field
            id="flat-defense"
            label="Flat Defense"
            type="number"
            step="any"
          ></md-outlined-text-field>
          <md-outlined-text-field
            id="flat-hp"
            label="Flat HP"
            type="number"
            step="any"
          ></md-outlined-text-field>
          <md-outlined-text-field
            id="attack"
            label="Attack %"
            type="number"
            step="any"
          ></md-outlined-text-field>
          <md-outlined-text-field
            id="defense"
            label="Defense %"
            type="number"
            step="any"
          ></md-outlined-text-field>
          <md-outlined-text-field
            id="hp"
            label="HP %"
            type="number"
            step="any"
          ></md-outlined-text-field>
          <md-outlined-text-field
            id="critRate"
            label="Crit Rate"
            type="number"
            step="any"
          ></md-outlined-text-field>
          <md-outlined-text-field
            id="critDamage"
            label="Crit Damage"
            type="number"
            step="any"
          ></md-outlined-text-field>
          <md-outlined-text-field
            id="effectHit"
            label="Effect Hit"
            type="number"
            step="any"
          ></md-outlined-text-field>
          <md-outlined-text-field
            id="effectResist"
            label="Effect Resist"
            type="number"
            step="any"
          ></md-outlined-text-field>
        </div>

        <div class="buttons">
          <md-text-button type="button" id="resetBtn">Reset</md-text-button>
          <md-filled-button type="submit" id="submitBtn"
            >Calculate</md-filled-button
          >
        </div>
      </form>

      <div id="result-card">
        <div id="result-placeholder" class="placeholder-text">
          Waiting for calculation...
        </div>

        <div id="result-data" style="display: none">
          <div id="stat-breakdown-placeholder"></div>
          <hr />
          <div class="summary-line">
            <span>Total:</span>
            <span id="total-points-placeholder"></span>
          </div>
          <div class="summary-line">
            <span>Percentage:</span>
            <span id="total-percent-placeholder"></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const stats = {
        speed: { max: 2, label: "Speed" },
        "flat-attack": { max: 90, label: "Flat Attack" },
        "flat-defense": { max: 54, label: "Flat Defense" },
        "flat-hp": { max: 540, label: "Flat HP" },
        attack: { max: 1.6, label: "Attack %" },
        defense: { max: 1.6, label: "Defense %" },
        hp: { max: 1.6, label: "HP %" },
        critRate: { max: 2.0, label: "Crit Rate" },
        critDamage: { max: 3.0, label: "Crit Damage" },
        effectHit: { max: 3.0, label: "Effect Hit" },
        effectResist: { max: 3.0, label: "Effect Resist" },
      };

      const form = document.getElementById("statForm");
      const resultCard = document.getElementById("result-card");
      const resetBtn = document.getElementById("resetBtn");

      // Grab our placeholders
      const placeholderText = document.getElementById("result-placeholder");
      const resultData = document.getElementById("result-data");
      const statBreakdown = document.getElementById(
        "stat-breakdown-placeholder",
      );
      const totalPoints = document.getElementById("total-points-placeholder");
      const totalPercent = document.getElementById("total-percent-placeholder");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        let total = 0;
        let breakdownHTML = "";

        for (const key in stats) {
          const input = document.getElementById(key);
          const value = parseFloat(input.value);

          if (!isNaN(value) && value > 0) {
            const x = (value / stats[key].max) * 10;
            total += x;
            // Build HTML directly for the individual stats instead of pushing to an array
            breakdownHTML += `
              <div class="stat-line">
                <span>${stats[key].label}:</span>
                <span>${x.toFixed(2)} points</span>
              </div>
            `;
          }
        }

        resultCard.classList.add("visible");

        if (breakdownHTML === "") {
          // Show error in the main placeholder if nothing was entered
          placeholderText.textContent =
            "Please enter at least one stat to calculate.";
          placeholderText.style.display = "block";
          resultData.style.display = "none";
          return;
        }

        const z = (total / 90) * 100;

        // Edit the placeholders with the new calculated values
        statBreakdown.innerHTML = breakdownHTML;
        totalPoints.textContent = `${total.toFixed(2)} points`;
        totalPercent.textContent = `${z.toFixed(2)}%`;

        // Hide the waiting text and show the data
        placeholderText.style.display = "none";
        resultData.style.display = "block";
      });

      resetBtn.addEventListener("click", () => {
        // Reset all text fields
        for (const key in stats) {
          document.getElementById(key).value = "";
        }

        // Clear placeholders back to empty states
        statBreakdown.innerHTML = "";
        totalPoints.textContent = "";
        totalPercent.textContent = "";

        // Reset visibility back to default state
        placeholderText.textContent = "Waiting for calculation...";
        placeholderText.style.display = "block";
        resultData.style.display = "none";
        resultCard.classList.remove("visible");
      });
    </script>
  </body>
</html>
